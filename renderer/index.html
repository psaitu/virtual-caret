<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Virtual Caret</title>
    <link href="styles.css" rel="stylesheet" />
  </head>
  <body>
    <header class="hint">
      Type, click, and move around — watch the red caret glide.
      <span class="sub">Bike-style fluid typing · Electron</span>
    </header>
    <div class="textarea-container">
      <div id="virtual-caret"></div>
      <textarea id="textarea" spellcheck="false" autofocus placeholder="Start typing…"></textarea>
    </div>
    <script src="./script.js"></script>
  </body>
</html>
